name: Build

on:
  workflow_dispatch:
    inputs:
      adapters:
        description: 'Comma separated adapter subset (e.g. 26.3). Empty builds every adapter.'
        required: false
        default: ''
      tests:
        description: 'Run unit tests'
        type: boolean
        default: false
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
          cache: gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
      - name: Build
        env:
          ADAPTERS: ${{ inputs.adapters }}
          RUN_TESTS: ${{ inputs.tests }}
        run: |
          ARGS=":worldedit-bukkit:shadowJar --no-daemon -Dorg.gradle.jvmargs=-Xmx4g"
          if [ -n "$ADAPTERS" ]; then
            ARGS="$ARGS -Padapters=$ADAPTERS"
          fi
          if [ "$RUN_TESTS" = "true" ]; then
            ARGS="$ARGS test"
          fi
          ./gradlew $ARGS
      - name: Collect artifacts
        run: |
          mkdir -p dist
          cp worldedit-bukkit/build/libs/MikuWorldEdit-Paper-*.jar dist/
          ls -l dist
      - name: Archive Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: FastAsyncWorldEdit-Paper
          path: dist/*.jar
          if-no-files-found: error
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -m1 rootVersion gradle.properties | cut -d= -f2)
          if [ "v$VERSION" != "${{ github.ref_name }}" ]; then
            echo "tag ${{ github.ref_name }} does not match version $VERSION" >&2
            exit 1
          fi
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            echo "release ${{ github.ref_name }} already exists"
            exit 0
          fi
          # release notes are the body of the commit the tag points at
          git log -1 --pretty=%B "${{ github.ref_name }}" > notes.md
          if [ ! -s notes.md ]; then
            echo "release commit has no body" >&2
            exit 1
          fi
          gh release create "${{ github.ref_name }}" dist/*.jar \
            --title "${{ github.ref_name }}" \
            --notes-file notes.md