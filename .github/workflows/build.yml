name: Build

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      adapters:
        description: 'Comma separated adapter subset (e.g. 26.3). Empty builds every adapter.'
        required: false
        default: ''
      tests:
        description: 'Run unit tests'
        type: boolean
        default: false

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
          cache: gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
      - name: Build
        env:
          ADAPTERS: ${{ inputs.adapters }}
          RUN_TESTS: ${{ inputs.tests }}
        run: |
          ARGS=":worldedit-bukkit:shadowJar --no-daemon -Dorg.gradle.jvmargs=-Xmx4g"
          if [ -n "$ADAPTERS" ]; then
            ARGS="$ARGS -Padapters=$ADAPTERS"
          fi
          if [ "$RUN_TESTS" = "true" ]; then
            ARGS="$ARGS test"
          fi
          ./gradlew $ARGS
      - name: Collect artifacts
        run: |
          mkdir -p dist
          cp worldedit-bukkit/build/libs/FastAsyncWorldEdit-Paper-*.jar dist/
          ls -l dist
      - name: Archive Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: FastAsyncWorldEdit-Paper
          path: dist/*.jar
          if-no-files-found: error
